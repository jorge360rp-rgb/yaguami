name: Assemble Yaguanimix ZIP
on:
  push:
    branches:
      - codex/yaguanimix-2.7.7-text
    paths:
      - '.yaguanimix-upload/**'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/yaguanimix-2.7.7-text
      - name: Assemble and verify ZIP
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          root = pathlib.Path('.')
          target = root / 'Yaguanimix_2.7.7_TEXT.zip'
          parts = sorted((root / '.yaguanimix-upload').glob('part-*'))
          assert len(parts) == 2, 'Expected exactly two parts'
          with target.open('wb') as out:
              for part in parts:
                  out.write(part.read_bytes())
          assert hashlib.sha256(target.read_bytes()).hexdigest() == 'c2caca2ac25c2a3e87e1d8f49f0913dd4b3c89f263a54017c79c2f9707a3325d'
          with zipfile.ZipFile(target) as archive:
              assert archive.testzip() is None
          PY
      - name: Save complete ZIP and remove transfer files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Yaguanimix_2.7.7_TEXT.zip
          git rm -r .yaguanimix-upload
          git rm .github/workflows/assemble-yaguanimix.yml
          git commit -m "Add verified Yaguanimix 2.7.7 TEXT ZIP"
          git push origin HEAD:codex/yaguanimix-2.7.7-text
