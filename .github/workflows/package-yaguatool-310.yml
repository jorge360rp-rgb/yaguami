name: Package YaguaTool 3.1.0
on:
  push:
    branches: ['codex/yaguatool-3.1.0-editable-motion-lab']
    paths: ['.yaguatool-upload-310/**']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/yaguatool-3.1.0-editable-motion-lab
      - name: Verify package
        shell: python
        run: |
          import pathlib,hashlib,zipfile
          data=b''.join(p.read_bytes() for p in sorted(pathlib.Path('.yaguatool-upload-310').glob('part-*')))
          assert len(data)==15925789
          assert hashlib.sha256(data).hexdigest()=='2ba7a5845e5d12e716b3f66140c23bb56fda419fb7999138e4bbac8e0873bf88'
          pathlib.Path('YaguaTool_3.1.0.zip').write_bytes(data)
          with zipfile.ZipFile('YaguaTool_3.1.0.zip') as z:
            assert z.testzip() is None
            assert '3.1.0' in z.read('YaguaTool/VERSION.txt').decode()
            assert b'#include "' not in z.read('YaguaTool/jsx/yagua-host.jsx')
            assert b'YaguaLabRig' in z.read('YaguaTool/jsx/yagua-host.jsx')
            assert z.read('YaguaTool/assets/fluido-reference.png').startswith(b'\x89PNG')
      - name: Publish verified ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add YaguaTool_3.1.0.zip
          git rm -r .yaguatool-upload-310 .github/workflows/package-yaguatool-310.yml
          git commit -m "Publish verified YaguaTool 3.1.0 package"
          git push origin HEAD:codex/yaguatool-3.1.0-editable-motion-lab
