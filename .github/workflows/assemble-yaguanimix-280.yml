name: Assemble verified Yaguanimix Studio 2.8
on:
  push:
    branches:
      - codex/yaguanimix-2.8.0-studio
    paths:
      - '.yaguanimix-upload-280/**'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/yaguanimix-2.8.0-studio
      - name: Reconstruct and verify package
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          target=pathlib.Path('Yaguanimix_2.8.0_STUDIO.zip')
          parts=sorted(pathlib.Path('.yaguanimix-upload-280').glob('part-*'))
          assert len(parts)==2, 'Expected exactly two transfer parts'
          with target.open('wb') as output:
              for part in parts:
                  output.write(part.read_bytes())
          assert target.stat().st_size==13871542
          assert hashlib.sha256(target.read_bytes()).hexdigest()=='2611f90c9829634c91107ca468e80d1040dceca6f8b6c882c1f6f6df84460df4'
          with zipfile.ZipFile(target) as archive:
              assert archive.testzip() is None
              assert archive.read('Yaguanimix/VERSION.txt').decode('utf-8').startswith('Yaguanimix Studio 2.8.0')
          PY
      - name: Commit package and clean transfer files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Yaguanimix_2.8.0_STUDIO.zip
          git rm -r .yaguanimix-upload-280
          git rm .github/workflows/assemble-yaguanimix-280.yml
          git commit -m "Add verified Yaguanimix Studio 2.8.0 package"
          git push origin HEAD:codex/yaguanimix-2.8.0-studio
