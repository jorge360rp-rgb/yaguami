name: Package YaguaTool 3.0.1
on:
  push:
    branches: ['codex/yaguatool-3.0.1-ae-bridge']
    paths: ['.yaguatool-upload-301/**']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/yaguatool-3.0.1-ae-bridge
      - name: Verify package
        shell: python
        run: |
          import pathlib,hashlib,zipfile
          data=b''.join(p.read_bytes() for p in sorted(pathlib.Path('.yaguatool-upload-301').glob('part-*')))
          assert len(data)==15073929
          assert hashlib.sha256(data).hexdigest()=='af253b637922b928192656ef246d8d9b9f1808fb325a0fb26c1fc27f73950479'
          pathlib.Path('YaguaTool_3.0.1.zip').write_bytes(data)
          with zipfile.ZipFile('YaguaTool_3.0.1.zip') as z:
            assert z.testzip() is None
            assert '3.0.1' in z.read('YaguaTool/VERSION.txt').decode()
            assert b'#include "' not in z.read('YaguaTool/jsx/yagua-host.jsx')
            assert b'bootstrapNative' in z.read('YaguaTool/js/ae-bridge.js')
      - name: Publish verified ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add YaguaTool_3.0.1.zip
          git rm -r .yaguatool-upload-301 .github/workflows/package-yaguatool-301.yml
          git commit -m "Publish verified YaguaTool 3.0.1 AE connection fix"
          git push origin HEAD:codex/yaguatool-3.0.1-ae-bridge
