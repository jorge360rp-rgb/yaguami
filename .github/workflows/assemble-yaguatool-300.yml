name: Assemble YaguaTool 3.0.0
on:
  push:
    branches: ['codex/yaguatool-3.0.0-integration']
    paths: ['.yaguatool-upload/**']
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/yaguatool-3.0.0-integration
      - name: Verify and assemble release
        shell: python
        run: |
          import pathlib, hashlib, zipfile
          data=b''.join(p.read_bytes() for p in sorted(pathlib.Path('.yaguatool-upload').glob('part-*')))
          assert len(data)==14995092
          assert hashlib.sha256(data).hexdigest()=='a8df52b29f05c5112a61c7a18e1d4dfe21b111d32b50524165ce9dca9753c04e'
          target=pathlib.Path('YaguaTool_3.0.0.zip')
          target.write_bytes(data)
          with zipfile.ZipFile(target) as z:
            assert z.testzip() is None
            assert 'YaguaTool 3.0.0' in z.read('YaguaTool/VERSION.txt').decode()
      - name: Commit verified downloadable ZIP and remove transfer files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add YaguaTool_3.0.0.zip
          git rm -r .yaguatool-upload .github/workflows/assemble-yaguatool-300.yml
          git commit -m "Package verified YaguaTool 3.0.0 download"
          git push origin HEAD:codex/yaguatool-3.0.0-integration
